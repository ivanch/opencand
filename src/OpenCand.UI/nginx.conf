worker_processes 1;
events {
    worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

  server {
    listen       80;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # X-Content-Type-Options, Referrer-Policy and Content-Security-Policy.
    # Generated by docker-entrypoint.sh at container start, because the CSP connect-src
    # depends on the runtime VITE_API_BASE_URL. It is included in every location below because
    # nginx does not inherit add_header from the server block into a location that sets its own.
    include /etc/nginx/security-headers.conf;

    # SPA: unknown paths fall back to index.html, which must always be revalidated
    # so a new deploy (new hashed asset names) is picked up immediately.
    location / {
      try_files $uri $uri/ /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    # Runtime configuration generated at container start: never cache it
    location = /env.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    location = /index.html {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
    }

    # Vite output: file names carry a content hash (name-AbC123_x.js), so they never change
    location ~ "^/assets/.+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|svg|png|jpe?g|webp|gif)$" {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Other static files (public/ folder: unhashed images, favicon): short cache, revalidated daily
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
      try_files $uri =404;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=86400";
    }
  }
}
