name: Build All Projects

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_etl:
    name: Build ETL Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ETL Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: .
          build_dockerfile: src/OpenCand.ETL/Dockerfile

  build_api:
    name: Build API Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: .
          build_dockerfile: src/OpenCand.API/Dockerfile

  build_ui:
    name: Build UI Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build UI Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: src/OpenCand.UI
          build_dockerfile: Dockerfile
