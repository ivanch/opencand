name: Build All Projects

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  test_dotnet:
    name: Build and Test .NET
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build OpenCand.sln -c Release

      - name: Test
        run: dotnet test OpenCand.sln -c Release --no-build

  check_ui:
    name: Lint and Build UI
    runs-on: runner-slim-amd64
    defaults:
      run:
        working-directory: src/OpenCand.UI
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/OpenCand.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build_etl:
    needs: [test_dotnet]
    name: Build ETL Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ETL Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: .
          build_dockerfile: src/OpenCand.ETL/Dockerfile

  build_api:
    needs: [test_dotnet]
    name: Build API Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: .
          build_dockerfile: src/OpenCand.API/Dockerfile

  build_ui:
    needs: [check_ui]
    name: Build UI Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build UI Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/docker-build@main
        with:
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: src/OpenCand.UI
          build_dockerfile: Dockerfile
