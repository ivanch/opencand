name: ETL Build and Deploy

on:
  workflow_dispatch: {}

env:
  IMAGE_ETL: git.ivanch.me/ivanch/opencand.etl

jobs:
  build:
    name: Build ETL Image
    runs-on: runner-slim-amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Push ETL Image
        uses: https://git.ivanch.me/ivanch/pipeline-actions/build-and-push@main
        with:
          image: ${{ env.IMAGE_ETL }}
          registry_password: ${{ secrets.REGISTRY_PASSWORD }}
          ssh_key: ${{ secrets.SSH_KEY_DOCKERBUILD }}
          platforms: linux/amd64,linux/arm64
          build_context: .
          build_dockerfile: src/OpenCand.ETL/Dockerfile

  deploy:
    name: Deploy ETL to Production
    runs-on: runner-slim-amd64
    needs: build
    steps:
      - name: Deploy via SSH
        uses: https://git.ivanch.me/ivanch/pipeline-actions/ssh-deploy@main
        with:
          ssh_host: ${{ secrets.DEPLOY_HOST || secrets.LIVE_HOST }}
          ssh_username: ${{ secrets.DEPLOY_USERNAME || secrets.LIVE_USERNAME }}
          ssh_key: ${{ secrets.DEPLOY_KEY || secrets.LIVE_KEY }}
          remote_dir: ${{ secrets.DEPLOY_DIR || secrets.LIVE_PROJECT_DIR }}
          image: ${{ env.IMAGE_ETL }}
          image_tag: latest
